name: portfolio-objects-graphs
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: portfolio_admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD locally}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: ["minio-data:/data"]
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD locally}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7610:7687"]
    volumes: ["neo4j-data:/data"]
volumes:
  minio-data:
  neo4j-data:
