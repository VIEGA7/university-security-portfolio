name: portfolio-traffic
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports: ["127.0.0.1:9210:9200"]
    volumes: ["search-data:/usr/share/opensearch/data"]
  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.7
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["127.0.0.1:5610:5601"]
    depends_on: [opensearch]
volumes:
  search-data:
